name: reducera

x-logging: &default_logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-ai-runtime-environment: &ai_runtime_environment
  PORT: 3003
  APP_VERSION: ${APP_VERSION:-v1}
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  NEST_API: ${NEST_API:-http://api:3002/api/v1}
  INTERNAL_AI_API_SECRET: ${INTERNAL_AI_API_SECRET}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_API_KEY: ${QDRANT_API_KEY}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-reducera-embedding}
  QDRANT_MEMORY_COLLECTION: ${QDRANT_MEMORY_COLLECTION:-reducera-memory}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_MODEL_FLASH: ${OPENAI_MODEL_FLASH:-gpt-4.1-mini}
  OPENAI_MODEL_THINKING: ${OPENAI_MODEL_THINKING:-gpt-5-mini}
  OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-8192}
  OPENAI_THINKING_MAX_TOKENS: ${OPENAI_THINKING_MAX_TOKENS:-16000}
  OPENAI_FLASH_TEMPERATURE: ${OPENAI_FLASH_TEMPERATURE:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_ROUTES: ${LLM_ROUTES:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-}
  MISTRAL_MODEL_FLASH: ${MISTRAL_MODEL_FLASH:-}
  MISTRAL_MODEL_THINKING: ${MISTRAL_MODEL_THINKING:-}
  MISTRAL_MAX_TOKENS: ${MISTRAL_MAX_TOKENS:-}
  MISTRAL_THINKING_MAX_TOKENS: ${MISTRAL_THINKING_MAX_TOKENS:-}
  MISTRAL_FLASH_TEMPERATURE: ${MISTRAL_FLASH_TEMPERATURE:-}
  MISTRAL_THINKING_TEMPERATURE: ${MISTRAL_THINKING_TEMPERATURE:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-huggingface}
  MISTRAL_EMBEDDING_MODEL: ${MISTRAL_EMBEDDING_MODEL:-}
  HF_TOKEN: ${HF_TOKEN}
  HF_EMBEDDING_MODEL: ${HF_EMBEDDING_MODEL:-BAAI/bge-m3}
  HF_EMBEDDING_URL: ${HF_EMBEDDING_URL:-}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
  LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-/models/bge-m3}
  LOCAL_EMBEDDING_THREADS: ${LOCAL_EMBEDDING_THREADS:-4}
  LOCAL_EMBEDDING_MAX_LENGTH: ${LOCAL_EMBEDDING_MAX_LENGTH:-512}
  LOCAL_EMBEDDING_PRELOAD: ${LOCAL_EMBEDDING_PRELOAD:-false}
  LOCAL_EMBEDDING_ALLOW_DOWNLOAD: ${LOCAL_EMBEDDING_ALLOW_DOWNLOAD:-false}
  TAVILY_API_KEY: ${TAVILY_API_KEY}
  WEB_URL: ${FRONTEND_URL}
  ADMIN_URL: ${ADMIN_URL}


services:
  postgres:
    image: postgres:15-alpine
    container_name: reducera_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-reducera}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-reducera}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default_logging
    networks:
      - reducera_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  sandbox-db:
    image: postgres:15-alpine
    container_name: reducera_sandbox_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SANDBOX_DB_ADMIN_USER:-sandbox_admin}
      POSTGRES_PASSWORD: ${SANDBOX_DB_ADMIN_PASSWORD}
      POSTGRES_DB: ${SANDBOX_DB_NAME:-sandbox}
      SANDBOX_RUNNER_PASSWORD: ${SANDBOX_DB_RUNNER_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=64MB
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    volumes:
      - ./infra/sandbox-db/init.sh:/docker-entrypoint-initdb.d/10-sandbox.sh:ro
    tmpfs:
      - /var/lib/postgresql/data:size=256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SANDBOX_DB_ADMIN_USER:-sandbox_admin} -d ${SANDBOX_DB_NAME:-sandbox}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default_logging
    networks:
      - reducera_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  redis:
    image: redis:7-alpine
    container_name: reducera_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *default_logging
    networks:
      - reducera_network
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: reducera_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default_logging
    networks:
      - reducera_network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: reducera_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://reducera_prod:change_me_strong_random_password_min_24_chars@postgres:5432/reducera}
      SANDBOX_DATABASE_URL: ${SANDBOX_DATABASE_URL:-postgresql://sandbox_runner:${SANDBOX_DB_RUNNER_PASSWORD}@sandbox-db:5432/${SANDBOX_DB_NAME:-sandbox}}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT_INTERNAL:-6379}
      PORT: 3002
      NODE_ENV: ${NODE_ENV:-development}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3002}
      AI_URL: ${AI_URL:-http://ai-api:3003/ai/v1}
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_URL: ${ADMIN_URL}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      COOKIE_SECRET: ${COOKIE_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTERNAL_AI_API_SECRET: ${INTERNAL_AI_API_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
      PAYMENT_INTENT_TTL_MINUTES: ${PAYMENT_INTENT_TTL_MINUTES:-1440}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-10}
      MANUAL_PAYMENT_MAX_SUBMISSIONS: ${MANUAL_PAYMENT_MAX_SUBMISSIONS:-5}
      MANUAL_PAYMENT_ACCOUNTS: ${MANUAL_PAYMENT_ACCOUNTS}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-ReduCera <onboarding@resend.dev>}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-false}
      ARCJET_KEY: ${ARCJET_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/api/v1/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default_logging
    networks:
      - reducera_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"

  api-migrate:
    image: postgres:15-alpine
    container_name: reducera_api_migrate
    profiles: ["migrate"]
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER:-reducera_prod}
      PGDATABASE: ${POSTGRES_DB:-reducera}
      PGHOST: postgres
    volumes:
      - ./services/api/prisma/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        for d in /migrations/*/; do
          name=$$(basename "$$d")
          if psql -tAc "SELECT 1 FROM _prisma_migrations WHERE migration_name='$$name' AND rolled_back_at IS NULL LIMIT 1;" 2>/dev/null | grep -q 1; then
            echo "[skip] $$name"
            continue
          fi
          echo "[apply] $$name"
          psql -v ON_ERROR_STOP=1 -f "$$d/migration.sql"
          echo "[ok]    $$name"
        done
        echo "Migrations complete."
    networks:
      - reducera_network

  ai-api:
    build:
      context: ./services/ai-api
      dockerfile: Dockerfile
    container_name: reducera_ai_api
    restart: unless-stopped
    environment:
      <<: *ai_runtime_environment
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      RESOURCE_ALLOWLIST_HOSTS: ${RESOURCE_ALLOWLIST_HOSTS:-}
      RESOURCE_ALLOWLIST_SCHEMES: ${RESOURCE_ALLOWLIST_SCHEMES:-https}
      RESOURCE_ALLOWLIST_LOCAL: ${RESOURCE_ALLOWLIST_LOCAL:-false}
      AI_API_RATE_LIMIT: ${AI_API_RATE_LIMIT:-60}
      AI_API_RATE_BURST: ${AI_API_RATE_BURST:-10}
    ports:
      - "${AI_API_PORT:-3003}:3003"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default_logging
    volumes:
      - ${EMBEDDING_MODELS_DIR:-./models}:/models:ro
    networks:
      - reducera_network
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: reducera_web
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost/api/v1}
      NUXT_PUBLIC_AI_URL: ${NUXT_PUBLIC_AI_URL:-http://localhost/ai/v1}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost}
      API_URL_INTERNAL: ${API_URL_INTERNAL:-http://api:3002}
      AI_API_INTERNAL_URL: ${AI_API_INTERNAL_URL:-http://ai-api:3003}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      NITRO_PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default_logging
    networks:
      - reducera_network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  celery-worker:
    build:
      context: ./services/ai-api
      dockerfile: Dockerfile
    container_name: reducera_celery_worker
    restart: unless-stopped
    environment:
      <<: *ai_runtime_environment
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
      CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
    command: ["celery", "-A", "config.celery:celery_app", "worker", "--loglevel=info", "--concurrency=2", "--queues=celery", "--hostname=default@%h"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery:celery_app inspect ping -t 10 -d default@$$(hostname) 2>&1 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ${EMBEDDING_MODELS_DIR:-./models}:/models:ro
    networks:
      - reducera_network

  celery-chat-worker:
    build:
      context: ./services/ai-api
      dockerfile: Dockerfile
    container_name: reducera_celery_chat_worker
    restart: unless-stopped
    environment:
      <<: *ai_runtime_environment
      CELERY_WORKER_CONCURRENCY: ${CELERY_CHAT_WORKER_CONCURRENCY:-2}
      CELERY_WORKER_PREFETCH_MULTIPLIER: 1
    command: ["celery", "-A", "config.celery:celery_app", "worker", "--loglevel=info", "--concurrency=2", "--queues=chat", "--hostname=chat@%h"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery:celery_app inspect ping -t 10 -d chat@$$(hostname) 2>&1 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ${EMBEDDING_MODELS_DIR:-./models}:/models:ro
    networks:
      - reducera_network

  nginx:
    image: nginx:1.27-alpine
    container_name: reducera_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default_logging
    networks:
      - reducera_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"

  api-tools:
    profiles: ["tools"]
    build:
      context: ./services/api
      dockerfile: Dockerfile
      target: tools
    image: reducera-api-tools:dev
    restart: "no"
    working_dir: /repo/services/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://reducera_prod:change_me_strong_random_password_min_24_chars@postgres:5432/reducera}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/reducera_ls_scratch}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT_INTERNAL:-6379}
      INTERNAL_AI_API_SECRET: ${INTERNAL_AI_API_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      SANDBOX_DATABASE_URL: ${SANDBOX_DATABASE_URL:-postgresql://sandbox_runner:${SANDBOX_DB_RUNNER_PASSWORD}@sandbox-db:5432/${SANDBOX_DB_NAME:-sandbox}}
    volumes:
      - ./:/repo:ro
      - ./services/api:/repo/services/api
      - api_tools_node_modules:/repo/services/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    logging: *default_logging
    networks:
      - reducera_network

  web-tools:
    profiles: ["tools"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: tools
    image: reducera-web-tools:dev
    restart: "no"
    working_dir: /repo/apps/web
    environment:
      NODE_OPTIONS: ${WEB_TOOLS_NODE_OPTIONS:---max-old-space-size=4096}
    volumes:
      - ./:/repo
      - web_tools_node_modules:/repo/apps/web/node_modules
      - web_tools_pnpm_store:/home/node/.local/share/pnpm
    healthcheck:
      disable: true
    logging: *default_logging
    networks:
      - reducera_network

  ai-tools:
    profiles: ["tools"]
    build:
      context: ./services/ai-api
      dockerfile: Dockerfile
      target: deps
    image: reducera-ai-tools:dev
    restart: "no"
    working_dir: /repo/services/ai-api
    user: "1000:1000"
    environment:
      PYTHONPATH: /repo/services/ai-api
      HOME: /tmp
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
    volumes:
      - ./:/repo
    healthcheck:
      disable: true
    logging: *default_logging
    networks:
      - reducera_network

  repo-tools:
    profiles: ["tools"]
    image: python:3.11-slim
    restart: "no"
    working_dir: /repo
    user: "1000:1000"
    environment:
      HOME: /tmp
    volumes:
      - ./:/repo:ro
    healthcheck:
      disable: true
    logging: *default_logging
    networks:
      - reducera_network

networks:
  reducera_network:
    driver: bridge
    name: reducera_network

volumes:
  postgres_data:
    name: reducera_postgres_data
  redis_data:
    name: reducera_redis_data
  qdrant_data:
    name: reducera_qdrant_data
  nginx_logs:
    name: reducera_nginx_logs
  api_tools_node_modules:
    name: reducera_api_tools_node_modules
  web_tools_node_modules:
    name: reducera_web_tools_node_modules
  web_tools_pnpm_store:
    name: reducera_web_tools_pnpm_store